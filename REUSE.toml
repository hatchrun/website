# Licensing for pages, package metadata, GitHub configuration and NOTICE.
# Code files carry their own SPDX header; `reuse lint` in CI checks every
# file.
version = 1

[[annotations]]
path = [
  "**/*.md",
  "**/*.mdx",
  "package.json",
  "package-lock.json",
  ".github/**",
  "public/**",
  "NOTICE",
]
SPDX-FileCopyrightText = "Copyright 2026 Gamunu Balagalla <gamunu.balagalla@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
